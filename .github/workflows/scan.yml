name: Scan fares

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fare history lives in the Actions cache, not in git, so the repo stays small.
      - name: Restore fare history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: farescout-data-${{ github.run_id }}
          restore-keys: farescout-data-

      - name: Scan
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m farescout scan

      - name: Save fare history
        if: always() && hashFiles('data/farescout.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: farescout-data-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
